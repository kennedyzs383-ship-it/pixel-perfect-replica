name: Verificar Nuvem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar testes
        run: bun run test
      - name: Construir aplicação
        run: bun run build
      - name: Preparar Deno para Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar worker autónomo WhatsApp
        run: deno check supabase/functions/whatsapp-inbox-worker/index.ts
      - name: Verificar webhook multi-tenant WhatsApp
        run: deno check supabase/functions/whatsapp-webhook/index.ts
